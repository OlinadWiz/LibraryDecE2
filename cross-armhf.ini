[binaries]
c = 'arm-linux-gnueabihf-gcc'
ar = 'arm-linux-gnueabihf-ar'
strip = 'arm-linux-gnueabihf-strip'
pkgconfig = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
c_args = ['-O2', '-pipe', '-march=armv7-a', '-mfpu=neon-vfpv4', '-mfloat-abi=hard']
c_link_args = ['-Wl,-O1', '-Wl,--as-needed']
