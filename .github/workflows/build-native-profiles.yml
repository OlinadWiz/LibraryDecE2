name: Build native ABI profiles

on:
  workflow_dispatch:
  push:
    paths:
      - "native-profiles.json"
      - "native/**"
      - "cenc/**"
      - "dash/**"
      - ".github/workflows/build-native-profiles.yml"

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      profiles: ${{ steps.profiles.outputs.profiles }}
    steps:
      - uses: actions/checkout@v5
      - id: profiles
        shell: bash
        run: |
          value="$(jq -c '[.profiles[] | select(.enabled == true)]' native-profiles.json)"
          test "$(jq length <<<"$value")" -gt 0
          echo "profiles=$value" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-24.04
    container: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJson(needs.matrix.outputs.profiles) }}
    env:
      PROFILE: ${{ matrix.profile.id }}
      PACKAGE_ARCH: ${{ matrix.profile.package_arch }}
      GST_VERSION: ${{ matrix.profile.gstreamer_source }}
      GST_SERIES: ${{ matrix.profile.gstreamer_series }}
      SOUP_MAJOR: ${{ matrix.profile.soup_major }}
      LIBXML_OUTPUT: ${{ matrix.profile.libxml_output }}
      CENC_VERSION: 1.0.0
      CENC_REVISION: r5
      DASH_VERSION: 1.0.0
      DASH_REVISION: r1
      CENC_COMMIT: 445648a27dddd4c366af52a6a1f22ee9d14d1096
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates jq
      - uses: actions/checkout@v5
      - name: Validate profile
        shell: bash
        run: |
          test -f "${{ matrix.profile.cross_file_cenc }}"
          test -f "${{ matrix.profile.cross_file_dash }}"
          test "$SOUP_MAJOR" = 2
          case "$LIBXML_OUTPUT" in true|enabled) ;; *) exit 1;; esac
      - name: Install ARMHF build environment
        if: ${{ matrix.profile.compiler_prefix == 'arm-linux-gnueabihf' }}
        shell: bash
        run: |
          dpkg --add-architecture armhf
          apt-get update
          apt-get install -y --no-install-recommends \
            crossbuild-essential-armhf build-essential meson ninja-build python3 python3-pip \
            pkg-config pkgconf flex bison gettext binutils \
            libglib2.0-dev:armhf libgstreamer1.0-dev:armhf \
            libgstreamer-plugins-base1.0-dev:armhf libssl-dev:armhf \
            libxml2-dev:armhf libsoup2.4-dev:armhf zlib1g-dev:armhf liblzma-dev:armhf
          python3 -m pip install --break-system-packages 'meson==1.7.2'
      - name: Build CENC
        shell: bash
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_PATH: /usr/lib/arm-linux-gnueabihf/pkgconfig
        run: |
          git clone https://github.com/asrashley/gst-cencdec.git cenc-upstream
          git -C cenc-upstream checkout "$CENC_COMMIT"
          cp -a cenc-upstream upstream
          python3 cenc/patch-source.py upstream
          meson setup upstream/out upstream --cross-file "${{ matrix.profile.cross_file_cenc }}" --buildtype=release --strip
          meson compile -C upstream/out
          chmod +x cenc/build-ipk.sh
          cenc/build-ipk.sh "$PROFILE" "$CENC_VERSION" "$CENC_REVISION" "$PACKAGE_ARCH" upstream/out/src/libgstcencdec.so "$GST_SERIES" "${{ matrix.profile.runtime_machine }}"
          rm -rf upstream cenc-upstream
      - name: Build DASH
        shell: bash
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_PATH: /usr/lib/arm-linux-gnueabihf/pkgconfig
        run: |
          git clone --depth 1 --branch "$GST_VERSION" https://github.com/GStreamer/gstreamer.git upstream
          python3 dash/patch-source.py upstream
          meson setup upstream/out upstream --cross-file "${{ matrix.profile.cross_file_dash }}" \
            --force-fallback-for=libxml-2.0 --buildtype=release --strip \
            -Dauto_features=disabled -Dbase=enabled -Dgood=enabled -Dbad=disabled -Dugly=disabled \
            -Dgstreamer:tools=disabled -Dgstreamer:tests=disabled \
            -Dgst-plugins-base:tools=disabled -Dgst-plugins-base:tests=disabled \
            -Dgst-plugins-good:tests=disabled -Dgst-plugins-good:examples=disabled \
            -Dgst-plugins-good:adaptivedemux2=enabled -Dgst-plugins-good:soup-lookup-dep=true \
            -Dgst-plugins-good:soup-version="$SOUP_MAJOR" -Dlibxml2:default_library=static \
            -Dlibxml2:icu=disabled -Dlibxml2:minimum=false -Dlibxml2:output="$LIBXML_OUTPUT" -Dlibxml2:python=disabled
          ninja -C upstream/out subprojects/gst-plugins-good/ext/adaptivedemux2/libgstadaptivedemux2.so
          so="$(find upstream/out/subprojects/gst-plugins-good/ext/adaptivedemux2 -name libgstadaptivedemux2.so -print -quit)"
          chmod +x dash/build-ipk.sh
          dash/build-ipk.sh "$PROFILE" "$DASH_VERSION" "$DASH_REVISION" "$PACKAGE_ARCH" "$so" "$GST_SERIES" "${{ matrix.profile.runtime_machine }}"
      - name: Verify artifacts
        shell: bash
        run: |
          test "$(find . -maxdepth 1 -name 'jasontv-cenc-*.ipk' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name 'jasontv-dash-*.ipk' | wc -l)" -eq 1
          sha256sum jasontv-{cenc,dash}-*.ipk > "SHA256SUMS-$PROFILE.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: jasontv-native-${{ matrix.profile.id }}
          path: |
            jasontv-cenc-*.ipk
            jasontv-dash-*.ipk
            SHA256SUMS-*.txt
          if-no-files-found: error
