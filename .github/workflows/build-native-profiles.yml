name: Build native ABI profile

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profilo nativo da compilare
        required: true
        type: choice
        options:
          - armv7hf-neon-gst128-soup2
          - armv7hf-neon-gst126-soup2
          - armv7hf-neon-gst122-soup2

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-24.04
    outputs:
      config: ${{ steps.profile.outputs.config }}
    steps:
      - uses: actions/checkout@v5
      - id: profile
        shell: bash
        env:
          REQUESTED_PROFILE: ${{ inputs.profile }}
        run: |
          matches="$(jq -c --arg id "$REQUESTED_PROFILE" \
            '[.profiles[] | select(.enabled == true and .id == $id)]' native-profiles.json)"
          if [ "$(jq length <<<"$matches")" -ne 1 ]; then
            echo "Unknown or disabled native profile: $REQUESTED_PROFILE" >&2
            echo "Enabled profiles:" >&2
            jq -r '.profiles[] | select(.enabled == true) | "- " + .id' native-profiles.json >&2
            exit 1
          fi
          echo "config=$(jq -c '.[0]' <<<"$matches")" >> "$GITHUB_OUTPUT"

  build:
    needs: profile
    runs-on: ubuntu-24.04
    container: debian:bookworm
    env:
      PROFILE: ${{ fromJson(needs.profile.outputs.config).id }}
      PACKAGE_ARCH: ${{ fromJson(needs.profile.outputs.config).package_arch }}
      GST_VERSION: ${{ fromJson(needs.profile.outputs.config).gstreamer_source }}
      GST_SERIES: ${{ fromJson(needs.profile.outputs.config).gstreamer_series }}
      SOUP_MAJOR: ${{ fromJson(needs.profile.outputs.config).soup_major }}
      LIBXML_OUTPUT: ${{ fromJson(needs.profile.outputs.config).libxml_output }}
      LIBXML_PYTHON: ${{ fromJson(needs.profile.outputs.config).libxml_python }}
      CENC_VERSION: 1.0.0
      CENC_REVISION: r5
      DASH_VERSION: 1.0.0
      DASH_REVISION: r1
      CENC_COMMIT: 445648a27dddd4c366af52a6a1f22ee9d14d1096
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates jq
      - uses: actions/checkout@v5
      - name: Validate profile
        shell: bash
        run: |
          test -f "${{ fromJson(needs.profile.outputs.config).cross_file_cenc }}"
          test -f "${{ fromJson(needs.profile.outputs.config).cross_file_dash }}"
          test "$SOUP_MAJOR" = 2
          case "$LIBXML_OUTPUT" in true|enabled) ;; *) exit 1;; esac
          case "$LIBXML_PYTHON" in false|disabled) ;; *) exit 1;; esac
      - name: Install ARMHF build environment
        if: ${{ fromJson(needs.profile.outputs.config).compiler_prefix == 'arm-linux-gnueabihf' }}
        shell: bash
        run: |
          dpkg --add-architecture armhf
          apt-get update
          apt-get install -y --no-install-recommends \
            crossbuild-essential-armhf build-essential meson ninja-build python3 python3-pip \
            pkg-config pkgconf flex bison gettext binutils \
            libglib2.0-dev:armhf libgstreamer1.0-dev:armhf \
            libgstreamer-plugins-base1.0-dev:armhf libssl-dev:armhf \
            libxml2-dev:armhf libsoup2.4-dev:armhf zlib1g-dev:armhf liblzma-dev:armhf
          python3 -m pip install --break-system-packages 'meson==1.7.2'
      - name: Build CENC
        shell: bash
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_PATH: /usr/lib/arm-linux-gnueabihf/pkgconfig
        run: |
          git clone https://github.com/asrashley/gst-cencdec.git cenc-upstream
          git -C cenc-upstream checkout "$CENC_COMMIT"
          cp -a cenc-upstream upstream
          python3 cenc/patch-source.py upstream
          meson setup upstream/out upstream --cross-file "${{ fromJson(needs.profile.outputs.config).cross_file_cenc }}" --buildtype=release --strip
          meson compile -C upstream/out
          chmod +x cenc/build-ipk.sh
          cenc/build-ipk.sh "$PROFILE" "$CENC_VERSION" "$CENC_REVISION" "$PACKAGE_ARCH" upstream/out/src/libgstcencdec.so "$GST_SERIES" "${{ fromJson(needs.profile.outputs.config).runtime_machine }}"
          rm -rf upstream cenc-upstream
      - name: Build DASH
        shell: bash
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_PATH: /usr/lib/arm-linux-gnueabihf/pkgconfig
        run: |
          git clone --depth 1 --branch "$GST_VERSION" https://github.com/GStreamer/gstreamer.git upstream
          if [ "$GST_SERIES" = "1.22" ]; then
            (cd upstream && meson subprojects download libxml2)
          fi
          python3 dash/patch-source.py upstream "$GST_SERIES"
          SOUP_OPTIONS=()
          LIBXML_OPTIONS=()
          if [ "$GST_SERIES" != "1.22" ]; then
            SOUP_OPTIONS+=(
              -Dgst-plugins-good:soup-lookup-dep=true
              -Dgst-plugins-good:soup-version="$SOUP_MAJOR"
            )
            LIBXML_OPTIONS+=(
              -Dlibxml2:icu=disabled
              -Dlibxml2:minimum=false
              -Dlibxml2:output="$LIBXML_OUTPUT"
              -Dlibxml2:python="$LIBXML_PYTHON"
            )
          fi
          meson setup upstream/out upstream --cross-file "${{ fromJson(needs.profile.outputs.config).cross_file_dash }}" \
            --force-fallback-for=libxml-2.0 --buildtype=release --strip \
            -Dauto_features=disabled -Dbase=enabled -Dgood=enabled -Dbad=disabled -Dugly=disabled \
            -Dgstreamer:tools=disabled -Dgstreamer:tests=disabled \
            -Dgst-plugins-base:tools=disabled -Dgst-plugins-base:tests=disabled \
            -Dgst-plugins-good:tests=disabled -Dgst-plugins-good:examples=disabled \
            -Dgst-plugins-good:adaptivedemux2=enabled "${SOUP_OPTIONS[@]}" -Dlibxml2:default_library=static \
            "${LIBXML_OPTIONS[@]}"
          ninja -C upstream/out subprojects/gst-plugins-good/ext/adaptivedemux2/libgstadaptivedemux2.so
          so="$(find upstream/out/subprojects/gst-plugins-good/ext/adaptivedemux2 -name libgstadaptivedemux2.so -print -quit)"
          chmod +x dash/build-ipk.sh
          dash/build-ipk.sh "$PROFILE" "$DASH_VERSION" "$DASH_REVISION" "$PACKAGE_ARCH" "$so" "$GST_SERIES" "${{ fromJson(needs.profile.outputs.config).runtime_machine }}"
      - name: Verify artifacts
        shell: bash
        run: |
          test "$(find . -maxdepth 1 -name 'jasontv-cenc-*.ipk' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name 'jasontv-dash-*.ipk' | wc -l)" -eq 1
          sha256sum jasontv-{cenc,dash}-*.ipk > "SHA256SUMS-$PROFILE.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: jasontv-native-${{ inputs.profile }}
          path: |
            jasontv-cenc-*.ipk
            jasontv-dash-*.ipk
            SHA256SUMS-*.txt
          if-no-files-found: error
