name: Build CENC IPK

on:
  workflow_dispatch:
  push:
    paths:
      - "build-ipk.sh"
      - "cross-armhf.ini"
      - "README.md"
      - ".github/workflows/build-cenc-ipk.yml"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.decoder }} / ${{ matrix.architecture }}
    runs-on: ubuntu-24.04
    container: debian:bookworm

    strategy:
      fail-fast: false
      matrix:
        include:
          - decoder: zgemmah7
            architecture: cortexa15hf-neon-vfpv4

    env:
      CENC_VERSION: 1.0.0
      CENC_REVISION: r0
      UPSTREAM_COMMIT: 445648a27dddd4c366af52a6a1f22ee9d14d1096

    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout LibraryDecE2
        uses: actions/checkout@v5

      - name: Validate repository structure
        shell: bash
        run: |
          test -f build-ipk.sh
          test -f cross-armhf.ini
          test -f README.md
          echo "Repository structure is valid"

      - name: Install ARMHF cross toolchain and development sysroot
        shell: bash
        run: |
          dpkg --add-architecture armhf
          apt-get update
          apt-get install -y --no-install-recommends \
            crossbuild-essential-armhf \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            pkgconf \
            binutils \
            libglib2.0-dev:armhf \
            libgstreamer1.0-dev:armhf \
            libgstreamer-plugins-base1.0-dev:armhf \
            libxml2-dev:armhf \
            libssl-dev:armhf

      - name: Fetch pinned CENC source
        shell: bash
        run: |
          git clone https://github.com/asrashley/gst-cencdec.git upstream
          git -C upstream checkout "$UPSTREAM_COMMIT"
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"

      - name: Configure and cross-compile
        shell: bash
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_PATH: /usr/lib/arm-linux-gnueabihf/pkgconfig
        run: |
          meson setup upstream/out upstream \
            --cross-file cross-armhf.ini \
            --buildtype=release \
            --strip
          meson compile -C upstream/out
          test -f upstream/out/src/libgstcencdec.so
          arm-linux-gnueabihf-readelf -h upstream/out/src/libgstcencdec.so | tee readelf.txt
          grep -q 'Machine:.*ARM' readelf.txt

      - name: Build decoder-specific IPK
        shell: bash
        run: |
          chmod +x build-ipk.sh
          ./build-ipk.sh \
            "${{ matrix.decoder }}" \
            "$CENC_VERSION" \
            "$CENC_REVISION" \
            "${{ matrix.architecture }}" \
            upstream/out/src/libgstcencdec.so
          sha256sum jasontv-cenc-${{ matrix.decoder }}_*.ipk \
            > SHA256SUMS-${{ matrix.decoder }}.txt

      - name: Upload decoder IPK
        uses: actions/upload-artifact@v4
        with:
          name: jasontv-cenc-${{ matrix.decoder }}-${{ env.CENC_VERSION }}-${{ env.CENC_REVISION }}
          path: |
            jasontv-cenc-${{ matrix.decoder }}_*.ipk
            SHA256SUMS-${{ matrix.decoder }}.txt
          if-no-files-found: error
