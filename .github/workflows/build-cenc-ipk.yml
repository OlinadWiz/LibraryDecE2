name: Build CENC IPK

on:
  workflow_dispatch:
  push:
    paths:
      - "build-ipk.sh"
      - "cross-armhf.ini"
      - "README.md"
      - ".github/workflows/build-cenc-ipk.yml"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.decoder }} / ${{ matrix.architecture }}
    runs-on: ubuntu-24.04
    container: debian:bookworm

    strategy:
      fail-fast: false
      matrix:
        include:
          - decoder: zgemmah7
            architecture: cortexa15hf-neon-vfpv4

    env:
      CENC_VERSION: 1.0.0
      CENC_REVISION: r3
      UPSTREAM_COMMIT: 445648a27dddd4c366af52a6a1f22ee9d14d1096

    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout LibraryDecE2
        uses: actions/checkout@v5

      - name: Validate repository structure
        shell: bash
        run: |
          test -f build-ipk.sh
          test -f cross-armhf.ini
          test -f README.md
          echo "Repository structure is valid"

      - name: Install ARMHF cross toolchain and development sysroot
        shell: bash
        run: |
          dpkg --add-architecture armhf
          apt-get update
          apt-get install -y --no-install-recommends \
            crossbuild-essential-armhf \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            pkgconf \
            binutils \
            libglib2.0-dev:armhf \
            libgstreamer1.0-dev:armhf \
            libgstreamer-plugins-base1.0-dev:armhf \
            libssl-dev:armhf

      - name: Fetch pinned CENC source
        shell: bash
        run: |
          git clone https://github.com/asrashley/gst-cencdec.git upstream
          git -C upstream checkout "$UPSTREAM_COMMIT"
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_COMMIT"

      - name: Adapt upstream for ClearKey-only legacy Enigma2 images
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root_meson = Path("upstream/meson.build")
          source = root_meson.read_text(encoding="utf-8")
          old = "openssl_dep = dependency('openssl', version: '>= 1.0.0g', required : true)"
          new = "openssl_dep = dependency('openssl', version: '>= 1.0.0g', required : true, static : true)"
          if old not in source:
              raise SystemExit("Expected upstream OpenSSL dependency declaration not found")
          source = source.replace(old, new)
          source = source.replace("libxml2_dep = dependency('libxml-2.0', required : true)\n", "")
          root_meson.write_text(source, encoding="utf-8")

          src_meson = Path("upstream/src/meson.build")
          source = src_meson.read_text(encoding="utf-8")
          source = source.replace(", libxml2_dep", "")
          src_meson.write_text(source, encoding="utf-8")

          c_file = Path("upstream/src/gstcencdec.c")
          source = c_file.read_text(encoding="utf-8")
          source = source.replace("#include <libxml/parser.h>\n", "")
          source = source.replace("#include <libxml/tree.h>\n", "")
          source = source.replace(
              '#define CLEARKEY_PROTECTION_ID "e2719d58-a985-b3c9-781a-b030af78d30e"',
              '#define CLEARKEY_PROTECTION_ID "e2719d58-a985-b3c9-781a-b030af78d30e"\n'
              '#define WIDEVINE_CENC_ID "edef8ba9-79d6-4ace-a3c8-27dcd51d21ed"\n'
              '#define PLAYREADY_CENC_ID "9a04f079-9840-4286-ab92-e65be0885f95"',
          )
          source = source.replace(
              '     "application/x-cenc, protection-system=(string)" CLEARKEY_PROTECTION_ID "; "\n'
              '     "application/x-cenc, protection-system=(string)" M_MPD_PROTECTION_ID "; "\n'
              '     "application/x-cenc, protection-system=(string)" M_PSSH_PROTECTION_ID)',
              '     "application/x-cenc, protection-system=(string)" CLEARKEY_PROTECTION_ID)',
          )
          source = source.replace(
              "  CLEARKEY_PROTECTION_ID,\n  M_MPD_PROTECTION_ID,\n  M_PSSH_PROTECTION_ID,\n  NULL",
              "  CLEARKEY_PROTECTION_ID,\n  NULL",
          )
          source = source.replace(
              '     "application/x-cenc, protection-system=(string)" CLEARKEY_PROTECTION_ID)',
              '     "application/x-cenc, protection-system=(string)" CLEARKEY_PROTECTION_ID "; "\n'
              '     "application/x-cenc, protection-system=(string)" WIDEVINE_CENC_ID "; "\n'
              '     "application/x-cenc, protection-system=(string)" PLAYREADY_CENC_ID)',
          )
          source = source.replace(
              "  CLEARKEY_PROTECTION_ID,\n  NULL",
              "  CLEARKEY_PROTECTION_ID,\n  WIDEVINE_CENC_ID,\n  PLAYREADY_CENC_ID,\n  NULL",
          )
          source = re.sub(
              r"static gboolean\ngst_cenc_decrypt_parse_content_protection_element .*?\n}\n\nstatic gboolean\ngst_cenc_decrypt_sink_event_handler",
              "static gboolean\ngst_cenc_decrypt_sink_event_handler",
              source,
              flags=re.S,
          )
          source = re.sub(
              r"if\(g_ascii_strcasecmp\(loc, \"dash/mpd\"\)==0.*?gst_cenc_decrypt_parse_pssh_box \(self, pssi\);\n        }",
              "if (system_id && (g_ascii_strcasecmp(system_id, CLEARKEY_PROTECTION_ID) == 0 ||\n"
              "        g_ascii_strcasecmp(system_id, WIDEVINE_CENC_ID) == 0 ||\n"
              "        g_ascii_strcasecmp(system_id, PLAYREADY_CENC_ID) == 0)) {\n"
              "          GST_DEBUG_OBJECT (self, \"event carries ClearKey data\");\n"
              "          self->drm_type = GST_DRM_CLEARKEY;\n"
              "        }",
              source,
              flags=re.S,
          )
          if "xmlReadMemory" in source or "gst_cenc_decrypt_parse_content_protection_element" in source:
              raise SystemExit("Failed to remove upstream Marlin/libxml2 code")
          if "WIDEVINE_CENC_ID" not in source or "PLAYREADY_CENC_ID" not in source:
              raise SystemExit("Failed to add CENC compatibility system identifiers")
          c_file.write_text(source, encoding="utf-8")
          PY

      - name: Configure and cross-compile
        shell: bash
        env:
          PKG_CONFIG_LIBDIR: /usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_PATH: /usr/lib/arm-linux-gnueabihf/pkgconfig
        run: |
          meson setup upstream/out upstream \
            --cross-file cross-armhf.ini \
            --buildtype=release \
            --strip
          meson compile -C upstream/out
          test -f upstream/out/src/libgstcencdec.so
          arm-linux-gnueabihf-readelf -h upstream/out/src/libgstcencdec.so | tee readelf.txt
          grep -q 'Machine:.*ARM' readelf.txt
          arm-linux-gnueabihf-readelf -d upstream/out/src/libgstcencdec.so | tee dynamic.txt
          if grep -Eq 'libcrypto\.so|libxml2\.so' dynamic.txt; then
            echo "ERROR: forbidden legacy-image dependency is still dynamically linked" >&2
            exit 1
          fi

      - name: Build decoder-specific IPK
        shell: bash
        run: |
          chmod +x build-ipk.sh
          ./build-ipk.sh \
            "${{ matrix.decoder }}" \
            "$CENC_VERSION" \
            "$CENC_REVISION" \
            "${{ matrix.architecture }}" \
            upstream/out/src/libgstcencdec.so
          sha256sum jasontv-cenc-${{ matrix.decoder }}_*.ipk \
            > SHA256SUMS-${{ matrix.decoder }}.txt

      - name: Upload decoder IPK
        uses: actions/upload-artifact@v4
        with:
          name: jasontv-cenc-${{ matrix.decoder }}-${{ env.CENC_VERSION }}-${{ env.CENC_REVISION }}
          path: |
            jasontv-cenc-${{ matrix.decoder }}_*.ipk
            SHA256SUMS-${{ matrix.decoder }}.txt
          if-no-files-found: error
